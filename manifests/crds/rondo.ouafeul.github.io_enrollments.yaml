                - Degraded
                - Unknown
                type: string
              healthMessage:
                description: names the offending object
                maxLength: 2048
                type: string
              history:
                items:
                  description: AttemptInfo is one Job attempt.
                  properties:
                    finishedAt:
                      format: date-time
                      type: string
                    jobName:
                      type: string
                    message:
                      description: failure cause
                      maxLength: 2048
                      type: string
                    result:

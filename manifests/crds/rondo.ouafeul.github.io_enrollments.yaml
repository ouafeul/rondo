                    type: boolean
                  timeout:
                    default: 10m
                    type: string
                  wait:
                    default: true
                    type: boolean
                type: object
              target:
                description: a Target name or role; must match exactly one Target
                minLength: 1
                type: string
              values:
                description: overlay on the Component values

# Third-party artefacts that cross the air gap. scripts/ci/resolve-deps.py validates this file,
# scripts/ci/download-deps.py, mirror-images.py and mirror-rpms.py mirror it, and
# `rondo component lint --deps` checks the tree against it.
#
# Every entry has:
#   name      identifier (for providers: <namespace>/<type>)
#   version   upstream version; `{version}` in `source_url` and `path` expands to it
#   kind      how the entry is mirrored, and so which root `path` is relative to:
#               file            --files-url           plain HTTP file (binaries)
#               grafana_plugin  --files-url           plain HTTP file (grafana_plugins)
#               provider        --provider-mirror     OpenTofu provider, laid out as a static
#                                                     network_mirror tree (tofu_providers)
#               chart           --oci-registry/charts Helm chart pushed as an OCI artefact
#               image           --oci-registry        container image (docker_images)
#               rpm             --rpm-url             package repository (rpm_packages)
#   path      relative path under that root:
#               file, grafana_plugin  <tool>/{version}/<file>
#               provider              <namespace>/<type>/<archive>.zip; the archive name ends
#                                     in _<os>_<arch>.zip; `registry` (default
#                                     registry.opentofu.org) is the hostname of the tree
#               chart                 chart name
#               image                 image path without registry
#               rpm                   repository sub-path (el9)
# Entries also carry `source_url` (binaries, tofu_providers, grafana_plugins) or `source_repo`
# (helm_charts; `source_type: oci` for an OCI source).
#
# The target (OCI registry, file server, RPM server, provider mirror) is not part of this file:
# it is given to the scripts by flags or MIRROR_* environment variables (see mirror.yml).

binaries:
  - name: k3s
    version: "v1.31.4+k3s1"
    source_url: "https://github.com/k3s-io/k3s/releases/download/{version}/k3s"
    kind: file
    path: "k3s/{version}/k3s"

  - name: k3s-airgap-images
    version: "v1.31.4+k3s1"
    source_url: "https://github.com/k3s-io/k3s/releases/download/{version}/k3s-airgap-images-amd64.tar.zst"
    kind: file
    path: "k3s/{version}/k3s-airgap-images-amd64.tar.zst"

  - name: opentofu
    version: "1.11.14"
    source_url: "https://github.com/opentofu/opentofu/releases/download/v{version}/tofu_{version}_linux_amd64.zip"
    kind: file
    path: "opentofu/{version}/tofu_{version}_linux_amd64.zip"

  - name: helm
    version: "v3.22.1"
    source_url: "https://get.helm.sh/helm-{version}-linux-amd64.tar.gz"
    kind: file
    path: "helm/{version}/helm-{version}-linux-amd64.tar.gz"

  - name: kubectl
    version: "v1.34.13"
    source_url: "https://dl.k8s.io/release/{version}/bin/linux/amd64/kubectl"
    kind: file
    path: "kubectl/{version}/kubectl"

  - name: k9s
    version: "v0.40.5"
    source_url: "https://github.com/derailed/k9s/releases/download/{version}/k9s_Linux_amd64.tar.gz"
    kind: file
    path: "k9s/{version}/k9s_Linux_amd64.tar.gz"

  - name: yq
    version: "v4.44.6"
    source_url: "https://github.com/mikefarah/yq/releases/download/{version}/yq_linux_amd64"
    kind: file
    path: "yq/{version}/yq_linux_amd64"

  - name: helmfile
    version: "0.171.0"
    source_url: "https://github.com/helmfile/helmfile/releases/download/v{version}/helmfile_{version}_linux_amd64.tar.gz"
    kind: file
    path: "helmfile/{version}/helmfile_{version}_linux_amd64.tar.gz"

  # Last helm-diff with a command/hooks plugin.yaml: later ones need Helm >= 3.18.
  - name: helm-diff
    version: "v3.9.14"
    source_url: "https://github.com/databus23/helm-diff/releases/download/{version}/helm-diff-linux-amd64.tgz"
    kind: file
    path: "helm-diff/{version}/helm-diff-linux-amd64.tgz"

  - name: rke2
    version: "v1.34.5+rke2r1"
    source_url: "https://github.com/rancher/rke2/releases/download/{version}/rke2.linux-amd64"
    kind: file
    path: "rke2/{version}/rke2.linux-amd64"

  - name: rke2-sha256sum
    version: "v1.34.5+rke2r1"
    source_url: "https://github.com/rancher/rke2/releases/download/{version}/sha256sum-amd64.txt"
    kind: file
    path: "rke2/{version}/sha256sum-amd64.txt"

tofu_providers:
  - name: hashicorp/vsphere
    version: "2.9.3"
    source_url: "https://releases.hashicorp.com/terraform-provider-vsphere/{version}/terraform-provider-vsphere_{version}_linux_amd64.zip"
    kind: provider
    path: "hashicorp/vsphere/terraform-provider-vsphere_{version}_linux_amd64.zip"

  - name: hashicorp/cloudinit
    version: "2.3.7"
    source_url: "https://releases.hashicorp.com/terraform-provider-cloudinit/{version}/terraform-provider-cloudinit_{version}_linux_amd64.zip"
    kind: provider
    path: "hashicorp/cloudinit/terraform-provider-cloudinit_{version}_linux_amd64.zip"

  - name: rancher/rancher2
    version: "14.1.1"
    source_url: "https://github.com/rancher/terraform-provider-rancher2/releases/download/v{version}/terraform-provider-rancher2_{version}_linux_amd64.zip"
    kind: provider
    path: "rancher/rancher2/terraform-provider-rancher2_{version}_linux_amd64.zip"

# docker_images: generated by scripts/ci/extract-helm-images.py, never edited by hand.

helm_charts:
  - name: metallb
    version: "0.14.9"
    source_repo: "https://metallb.github.io/metallb"
    kind: chart
    path: metallb

  - name: rancher
    version: "2.14.0"
    source_repo: "https://releases.rancher.com/server-charts/latest"
    kind: chart
    path: rancher

  - name: cert-manager
    version: "v1.16.2"
    source_repo: "https://charts.jetstack.io"
    kind: chart
    path: cert-manager

  - name: traefik
    version: "41.0.2"
    source_repo: "https://traefik.github.io/charts"
    kind: chart
    path: traefik

rpm_packages: []

base_images:
  - name: ansible-core
    version: "2.18.6"
    source_url: "https://pypi.org/project/ansible-core/2.18.6/"
    note: "installed by pip in build/toolbox/Dockerfile (ARG ANSIBLE_CORE_VERSION)"

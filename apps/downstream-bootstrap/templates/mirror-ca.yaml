{{- /*
The mirror CA, in every namespace that asks for it. The Secret always exists so that
components can mount it unconditionally; ca.crt is empty when the mirror's certificate is
publicly trusted (artifacts.caCertificateFile unset): test it is non-empty before using it.
*/}}
{{- range .Values.mirrorCA.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.mirrorCA.secretName }}
  namespace: {{ . }}
type: Opaque
data:
  ca.crt: {{ $.Values.mirrorCA.pem | default "" | b64enc | quote }}
{{- end }}

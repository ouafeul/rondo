{{- if .Values.mirrorCA.pem }}
{{- range .Values.mirrorCA.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.mirrorCA.secretName }}
  namespace: {{ . }}
type: Opaque
stringData:
  ca.crt: |
{{ $.Values.mirrorCA.pem | indent 4 }}
{{- end }}
{{- end }}

# Upstream defaults on purpose: extract-helm-images.py inventories the mirror from them.
image:
  repository: docker.io/rancher/local-path-provisioner
  tag: v0.0.37
  pullPolicy: IfNotPresent

helperImage:
  repository: docker.io/library/busybox
  tag: "1.38.0"

storageClass:
  name: local-path
  default: true
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer

nodePath: /var/lib/rancher/local-path-provisioner

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

priorityClassName: system-cluster-critical

apiVersion: rondo.ouafeul.github.io/v1alpha1
kind: Component
metadata:
  name: cert-manager
spec:
  chart:
    oci: ${CHARTS_OCI}/cert-manager
    version: v1.21.3
  namespace: cert-manager
  values:
    cainjector:
      image:
        repository: ${target.values.imageRegistry}/jetstack/cert-manager-cainjector
    crds:
      enabled: true
      keep: true
    global:
      priorityClassName: system-cluster-critical
    image:
      repository: ${target.values.imageRegistry}/jetstack/cert-manager-controller
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 64Mi
    startupapicheck:
      image:
        repository: ${target.values.imageRegistry}/jetstack/cert-manager-startupapicheck
    webhook:
      image:
        repository: ${target.values.imageRegistry}/jetstack/cert-manager-webhook

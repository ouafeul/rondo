apiVersion: rondo.ouafeul.github.io/v1alpha1
kind: Component
metadata:
  name: metallb
spec:
  chart:
    oci: ${CHARTS_OCI}/metallb
    version: 0.16.2
  namespace: metallb-system
  values:
    controller:
      image:
        repository: ${target.values.imageRegistry}/metallb/controller
      priorityClassName: system-cluster-critical
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
    # Layer 2 only: no BGP backend (frr-k8s), so no FRR images to mirror.
    frrk8s:
      enabled: false
    speaker:
      image:
        repository: ${target.values.imageRegistry}/metallb/speaker
      priorityClassName: system-cluster-critical
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi

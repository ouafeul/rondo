apiVersion: rondo.ouafeul.github.io/v1alpha1
kind: Component
metadata:
  name: downstream-bootstrap
spec:
  chart:
    oci: ${CHARTS_OCI}/downstream-bootstrap
    version: 0.3.1
  dependsOn:
  - name: metallb
  - name: cert-manager
  namespace: kube-system
  values:
    ingressIP: ${target.values.ingressIP}
    mirrorCA:
      pem: ${target.values.mirrorCA}

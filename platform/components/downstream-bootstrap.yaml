apiVersion: rondo.ouafeul.github.io/v1alpha1
kind: Component
metadata:
  name: downstream-bootstrap
spec:
  chart:
    oci: oci://${REGISTRY_HOST}/${ARTIFACTORY_HELM_REPO}/downstream-bootstrap
    version: 0.2.2
  dependsOn:
  - name: metallb
  - name: cert-manager
  namespace: kube-system
  values:
    ingressIP: ${target.values.ingressIP}
    artifactoryCA:
      pem: ${target.values.artifactoryCA}

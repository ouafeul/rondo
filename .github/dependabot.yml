# One monthly pull request for every ecosystem, after a cooldown so fresh releases settle first.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories: [/docs, /web/dashboard]
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint must support a TypeScript major before the dashboard can take it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - /build/controller
      - /build/toolbox
      - /build/component-toolbox
      - /build/sandbox-machine
      - /build/ci-toolbox
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

name: E2E

# The sandbox end to end (scripts/ci/e2e-sandbox.sh): RONDO's images built from the sources,
# the generic artifact mirror (zot + nginx: OCI images and charts, files, OCI provider mirror,
# http state), the test component on a management cluster, a downstream and a machine.
# Weekly, by hand, and on pull requests labelled e2e.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"

jobs:
  sandbox:
    name: Sandbox end to end
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      # Images, k3d nodes and the mirror's cache need more than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Sandbox tools (k3d, kubectl, helm)
        run: |
          scripts/ci/e2e-sandbox.sh tools "${RUNNER_TEMP}/tools"
          echo "${RUNNER_TEMP}/tools" >> "${GITHUB_PATH}"

      - name: Scenario
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
        run: scripts/ci/e2e-sandbox.sh run

      - name: Collect logs
        if: failure()
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
        run: scripts/ci/e2e-sandbox.sh collect "${RUNNER_TEMP}/e2e-logs"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-sandbox-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 14

      - name: Clean up
        if: always()
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
        run: scripts/ci/e2e-sandbox.sh cleanup

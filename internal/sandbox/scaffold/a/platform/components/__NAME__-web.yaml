# Archetype A, first-party chart: apps/__NAME__-web, which the component's CI publishes with its
# image (build/__NAME__-web). Tokens: ${REGISTRY_HOST}, ${ARTIFACTORY_*} and
# ${INGRESS_BASE_DOMAIN} come from the site; ${target.values.*} from the Target; ${secrets.*} from
# the Secrets the site declares (secrets.components in rondo.yaml).
apiVersion: rondo.ouafeul.github.io/v1alpha1
kind: Component
metadata:
  name: __NAME__-web
spec:
  chart:
    oci: oci://${REGISTRY_HOST}/${ARTIFACTORY_HELM_REPO}/__NAME__-web
    version: 0.1.0                      # the one in apps/__NAME__-web/Chart.yaml
    published: true                     # published by the component's CI, not mirrored
  namespace: __NAME__
  dependsOn:
    - name: traefik                     # the Target's base layer, awaited until Ready
  values:
    image:
      repository: ${target.values.imageRegistry}/__NAME__/web
    message: "${target.values.helloMessage}"
    token: ${secrets.TOKEN}
    ingress:
      host: __NAME__.apps.${INGRESS_BASE_DOMAIN}
  valuesFrom:
    - secretRef: {name: __NAME__}
      keys: [TOKEN]

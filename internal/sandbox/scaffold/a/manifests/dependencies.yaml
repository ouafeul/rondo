# What the site mirrors for this component: upstream charts (helm_charts),
# files (binaries), RPM repositories (rpm_packages). Each entry has a `kind` and a `path` (see
# the header of RONDO's own manifests/dependencies.yaml). The charts of apps/ and the
# `provenance: component` artifacts are not listed here: the component's CI publishes them.
# `rondo component lint --deps` rejects a chart of the tree that is missing here.
helm_charts:
- name: podinfo
  version: "6.17.0"
  source_repo: "https://stefanprodan.github.io/podinfo"
  kind: chart
  path: podinfo

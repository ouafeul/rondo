# A component with a pod that downloads from the mirror, credentials outside the URL: the
# subject of TestMirrorDownloadInAChartIsAuthenticated.
apiVersion: rondo.ouafeul.github.io/v1alpha1
kind: Component
metadata:
  name: guard
spec:
  chart:
    oci: ${CHARTS_OCI}/guard
    published: true
    version: 0.1.0
  namespace: guard
  values:
    initContainer:
      command:
      - -ec
      - |
        curl -fsSL -u "$MIRROR_USER:$MIRROR_PASSWORD" -o /tmp/p.zip \
          ${FILES_URL}/${FILES_REPOSITORY}/guard/plugin.zip
    envRenderSecret:
      MIRROR_PASSWORD: ${secrets.mirrorPassword}
      MIRROR_USER: ${secrets.mirrorUser}
  valuesFrom:
  - keys:
    - mirrorPassword
    - mirrorUser
    secretRef:
      name: rondo-platform-values

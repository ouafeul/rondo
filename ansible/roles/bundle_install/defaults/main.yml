rondo_mirror_files_url: ""
rondo_mirror_user: ""
rondo_mirror_password: ""
rondo_mirror_ca_path: /etc/pki/ca-trust/source/anchors/mirror-ca.pem

rondo_workdir: "/opt/rondo/{{ rondo_component }}"

rondo_rpm_repos: []

rondo_artifacts: []

rondo_config: {}

rondo_installer: {}
rondo_installer_defaults:
  phases: []
  config_file: ""
  config_format: shell
  secrets_file: ""
  steps_flag: "--steps"
  skip_flag: "--skip"
  config_flag: ""
  secrets_flag: ""
  become: true
  timeout: 3600

rondo_secrets: {}

rondo_run_installer: true

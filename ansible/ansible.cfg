[defaults]
inventory            = inventory.ini
roles_path           = ./roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = default
force_color          = False
nocolor              = 1
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = /work/.ansible/facts
local_tmp            = /work/.ansible/tmp
interpreter_python   = /usr/bin/python3
any_errors_fatal     = False

[ssh_connection]
ssh_args             = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining           = True
control_path_dir     = /work/.ansible/cp
